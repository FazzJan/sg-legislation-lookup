<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Legislation & Section Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, input, select, button, a {
            font-family: 'JetBrains Mono', monospace;
        }
        :root {
            --bg-main: #020617;
            --bg-card: #0f172a;
            --bg-input: #020617;
            --border: #334155;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent: #34d399;
            --yes: #fbbf24;
            --no: #94a3b8;
        }
        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #475569;
            --text-dim: #64748b;
            --accent: #4f46e5;
            --yes: #b45309;
            --no: #64748b;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.2s, color 0.2s;
        }
    </style>
</head>
<body data-theme="dark" class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <main class="max-w-3xl mx-auto w-full space-y-6">
        <!-- Header -->
        <header class="flex items-center justify-between border-b pb-4" style="border-color: var(--border);">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold" style="color: var(--accent);">⚡ Singapore Legislation Lookup</h1>
                <p class="text-xs mt-1" style="color: var(--text-dim);">Direct AGC links + Arrestable / Bailable from CPC 2010 First Schedule</p>
            </div>
            <button id="themeToggle" class="px-3 py-1.5 rounded-lg border text-xs font-medium shrink-0"
                style="border-color: var(--border); color: var(--text-muted); background: var(--bg-card);">
                ☀️ Light
            </button>
        </header>

        <!-- Search Form -->
        <div class="rounded-2xl border p-5 sm:p-6 shadow-xl space-y-4" style="background: var(--bg-card); border-color: var(--border);">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="statuteSelect" class="block text-xs font-semibold uppercase mb-1.5" style="color: var(--text-dim);">📁 Target Statute</label>
                    <select id="statuteSelect" class="w-full px-3.5 py-3 border rounded-xl focus:outline-none text-sm font-semibold"
                        style="background: var(--bg-input); border-color: var(--border); color: var(--text-main);">
                        <option value="PC1871" data-name="Penal Code 1871">Penal Code 1871 (PC)</option>
                        <option value="GEWCA2021" data-name="Guns, Explosives and Weapons Control Act 2021">GEWCA 2021 (Guns & Weapons)</option>
                        <option value="CESOWA1958" data-name="Corrosive and Explosive Substances and Offensive Weapons Act 1958">CESOWA 1958 (Corrosive & Weapons)</option>
                        <option value="PFA2004" data-name="Police Force Act 2004">Police Force Act 2004 (PFA)</option>
                        <option value="CPC2010" data-name="Criminal Procedure Code 2010">CPC 2010 (Criminal Procedure)</option>
                        <option value="POHA2014" data-name="Protection from Harassment Act 2014">POHA 2014 (Harassment)</option>
                        <option value="LCSCA2015" data-name="Liquor Control (Supply and Consumption) Act 2015">LCA 2015 (Liquor Control)</option>
                        <option value="MDA1973" data-name="Misuse of Drugs Act 1973">MDA 1973 (Misuse of Drugs)</option>
                        <option value="CMA1993" data-name="Computer Misuse Act 1993">CMA 1993 (Computer Misuse)</option>
                        <option value="RTA1961" data-name="Road Traffic Act 1961">RTA 1961 (Road Traffic)</option>
                        <option value="MOPONA1906" data-name="Miscellaneous Offences (Public Order and Nuisance) Act 1906">MOA 1906 (Misc Offences)</option>
                    </select>
                </div>

                <div>
                    <label for="sectionInput" class="block text-xs font-semibold uppercase mb-1.5" style="color: var(--text-dim);">🔢 Section Number</label>
                    <input type="text" id="sectionInput" placeholder="e.g. 302, 379, 332, 354, 6..."
                        class="w-full px-4 py-3 border rounded-xl focus:outline-none text-sm font-semibold"
                        style="background: var(--bg-input); border-color: var(--border); color: var(--text-main);"
                        autocomplete="off">
                </div>
            </div>

            <button id="lookupBtn" class="w-full py-3.5 rounded-xl font-bold text-sm transition-all shadow-md"
                style="background: var(--accent); color: #020617;">
                ⚡ Lookup Section
            </button>
        </div>

        <!-- Results -->
        <div id="resultsArea" class="space-y-4"></div>
    </main>

    <footer class="text-center text-xs py-6" style="color: var(--text-dim);">
        <p>Arrestable / Bailable for Penal Code taken from <strong>CPC 2010 First Schedule</strong>. Always verify on <a href="https://sso.agc.gov.sg" target="_blank" class="underline" style="color: var(--accent);">sso.agc.gov.sg</a></p>
    </footer>

    <script>
        // Curated data from CPC 2010 First Schedule (Penal Code) + common other statutes
        const knownSections = {
            "PC1871": {
                "302":  { title: "Murder", arrestable: "Yes", bailable: "No", punishment: "Death (s.300(a)) or life imprisonment + caning (s.300(b)–(d))" },
                "304":  { title: "Culpable homicide not amounting to murder", arrestable: "Yes", bailable: "No", punishment: "Up to life imprisonment (or 20 years) + fine/caning" },
                "304A": { title: "Causing death by rash or negligent act", arrestable: "Yes", bailable: "Yes", punishment: "Rash: up to 5 years; Negligent: up to 2 years, or fine, or both" },
                "323":  { title: "Voluntarily causing hurt", arrestable: "No", bailable: "Yes", punishment: "Imprisonment up to 3 years, or fine, or both" },
                "324":  { title: "Voluntarily causing hurt by dangerous weapons or means", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 7 years, or fine, or caning, or any combination" },
                "325":  { title: "Voluntarily causing grievous hurt", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 10 years and fine or caning" },
                "326":  { title: "Voluntarily causing grievous hurt by dangerous weapons", arrestable: "Yes", bailable: "No", punishment: "Life imprisonment or up to 15 years + fine or caning" },
                "332":  { title: "Voluntarily causing hurt to deter public servant from duty", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 7 years, or fine, or caning" },
                "333":  { title: "Voluntarily causing grievous hurt to deter public servant", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 15 years + fine or caning" },
                "353":  { title: "Assault or criminal force to deter public servant", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 4 years, or fine, or both" },
                "354":  { title: "Outrage of modesty", arrestable: "Yes", bailable: "Yes", punishment: "Imprisonment up to 3 years, or fine, or caning, or any combination" },
                "354A": { title: "Aggravated outrage of modesty", arrestable: "Yes", bailable: "No", punishment: "Imprisonment 2–10 years and caning" },
                "376":  { title: "Rape", arrestable: "Yes", bailable: "No", punishment: "Imprisonment 8–20 years + caning (higher if aggravated)" },
                "379":  { title: "Theft", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 3 years, or fine, or both" },
                "380":  { title: "Theft in dwelling-house, building or vessel", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 7 years and fine" },
                "381":  { title: "Theft by clerk or servant", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 7 years and fine" },
                "392":  { title: "Robbery", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 10 years + fine or caning" },
                "395":  { title: "Gang-robbery", arrestable: "Yes", bailable: "No", punishment: "Imprisonment 5–20 years + caning" },
                "406":  { title: "Criminal breach of trust", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 7 years, or fine, or both" },
                "408":  { title: "CBT by clerk or servant", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 15 years and fine" },
                "409":  { title: "CBT by public servant, banker, merchant or agent", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 20 years and fine" },
                "417":  { title: "Cheating", arrestable: "No", bailable: "Yes", punishment: "Imprisonment up to 3 years, or fine, or both" },
                "420":  { title: "Cheating and dishonestly inducing delivery of property", arrestable: "Yes", bailable: "No", punishment: "Imprisonment up to 10 years and fine" },
                "427":  { title: "Mischief causing damage of $500 or more", arrestable: "Yes", bailable: "Yes", punishment: "Imprisonment up to 2 years, or fine, or both" },
                "447":  { title: "Criminal trespass", arrestable: "Yes", bailable: "Yes", punishment: "Imprisonment up to 3 months, or fine up to $1,500, or both" },
                "506":  { title: "Criminal intimidation", arrestable: "No", bailable: "Yes", punishment: "Imprisonment up to 2 years, or fine, or both (higher if threat of death/grievous hurt)" }
            },
            "POHA2014": {
                "3": { title: "Intentional harassment, alarm or distress", arrestable: "Usually No*", bailable: "Yes", punishment: "Fine up to $5,000 and/or imprisonment up to 6 months" },
                "7": { title: "Unlawful stalking", arrestable: "Usually No*", bailable: "Yes", punishment: "Fine up to $5,000 and/or imprisonment up to 12 months" }
            },
            "CMA1993": {
                "3": { title: "Unauthorised access to computer material", arrestable: "Yes", bailable: "Yes", punishment: "Fine up to $5,000 and/or imprisonment up to 2 years" },
                "5": { title: "Unauthorised modification of computer material", arrestable: "Yes", bailable: "Yes", punishment: "Fine up to $10,000 and/or imprisonment up to 3 years" }
            },
            "MDA1973": {
                "5": { title: "Trafficking in controlled drugs", arrestable: "Yes", bailable: "No", punishment: "Depends on type & quantity (can include death)" },
                "8": { title: "Possession or consumption of controlled drug", arrestable: "Yes", bailable: "No", punishment: "Imprisonment and/or fine (enhanced for certain drugs/repeat)" }
            },
            "MOPONA1906": {
                "13": { title: "Drunk and disorderly in public", arrestable: "Yes", bailable: "Yes", punishment: "Fine up to $1,000 or imprisonment up to 1 month (higher for repeat)" },
                "14": { title: "Vandalism / defacing property", arrestable: "Yes", bailable: "No", punishment: "Fine up to $2,000 or imprisonment up to 3 years + caning" },
                "35": { title: "Fraudulent possession of property", arrestable: "No*", bailable: "Yes", punishment: "Fine up to $3,000 or imprisonment up to 1 year or both" }
            }
        };

        const statuteSelect = document.getElementById('statuteSelect');
        const sectionInput = document.getElementById('sectionInput');
        const lookupBtn = document.getElementById('lookupBtn');
        const resultsArea = document.getElementById('resultsArea');
        const themeToggle = document.getElementById('themeToggle');

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('legis-theme', theme);
        }
        setTheme(localStorage.getItem('legis-theme') || 'dark');
        themeToggle.addEventListener('click', () => {
            setTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        function cleanSection(input) {
            if (!input) return "";
            const match = input.trim().match(/([0-9]+[A-Za-z]?)/i);
            return match ? match[1].toUpperCase() : input.trim().toUpperCase();
        }

        function performLookup() {
            const actCode = statuteSelect.value;
            const selectedOption = statuteSelect.options[statuteSelect.selectedIndex];
            const actFullName = selectedOption.getAttribute('data-name');
            const cleanSec = cleanSection(sectionInput.value);

            resultsArea.innerHTML = '';

            if (!cleanSec) {
                resultsArea.innerHTML = `
                    <div class="rounded-2xl border p-5 text-center text-xs" style="background: var(--bg-card); border-color: var(--border); color: var(--text-dim);">
                        Enter a section number (e.g. 302, 332, 379, 354) to see Arrestable / Bailable status and official links.
                    </div>`;
                return;
            }

            const directSsoUrl = `https://sso.agc.gov.sg/Act/${actCode}?ProvIds=pr${cleanSec}-`;
            const googleSsoUrl = `https://www.google.com/search?q=${encodeURIComponent(`"${actFullName}" ("Section ${cleanSec}" OR "s.${cleanSec}") site:sso.agc.gov.sg`)}`;

            const info = knownSections[actCode] && knownSections[actCode][cleanSec];

            let html = '';

            if (info) {
                const arrestColor = info.arrestable.startsWith("Yes") ? "var(--yes)" : "var(--no)";
                const bailColor = info.bailable === "Yes" ? "var(--text-muted)" : "var(--yes)";

                html += `
                <div class="rounded-2xl border p-5 space-y-4" style="background: var(--bg-card); border-color: var(--border);">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs font-bold px-2.5 py-1 rounded border" style="color: var(--accent); border-color: var(--accent);">${actFullName}</span>
                        <h2 class="text-lg sm:text-xl font-bold">Section ${cleanSec}: ${info.title}</h2>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                        <div class="p-3 rounded-xl border" style="border-color: var(--border); background: var(--bg-main);">
                            <div class="text-xs uppercase mb-1" style="color: var(--text-dim);">Arrestable</div>
                            <div class="font-bold text-base" style="color: ${arrestColor};">${info.arrestable}</div>
                        </div>
                        <div class="p-3 rounded-xl border" style="border-color: var(--border); background: var(--bg-main);">
                            <div class="text-xs uppercase mb-1" style="color: var(--text-dim);">Bailable</div>
                            <div class="font-bold text-base" style="color: ${bailColor};">${info.bailable}</div>
                        </div>
                    </div>

                    <div>
                        <div class="text-xs uppercase mb-1.5" style="color: var(--text-dim);">Maximum Punishment</div>
                        <p class="p-3 rounded-xl border text-sm" style="background: var(--bg-main); border-color: var(--border);">${info.punishment}</p>
                    </div>

                    <p class="text-[11px]" style="color: var(--text-dim);">
                        Source: Criminal Procedure Code 2010 First Schedule (for Penal Code offences). Always verify the latest version on SSO.
                    </p>
                </div>`;
            } else {
                html += `
                <div class="rounded-2xl border p-5 text-sm" style="background: var(--bg-card); border-color: var(--border); color: var(--text-dim);">
                    <p class="mb-2">No local summary available for <strong>${actFullName} Section ${cleanSec}</strong>.</p>
                    <p class="text-xs">For non-Penal Code offences, the general CPC rule usually applies:<br>
                    • Imprisonment ≥ 3 years → generally Arrestable + Non-bailable<br>
                    • Imprisonment &lt; 3 years or fine only → generally Non-arrestable + Bailable<br>
                    (unless the specific Act says otherwise)</p>
                </div>`;
            }

            html += `
                <div class="rounded-2xl border p-5 space-y-3" style="background: var(--bg-card); border-color: var(--border);">
                    <div class="text-xs font-bold uppercase" style="color: var(--text-dim);">Official Links</div>
                    <div class="flex flex-col gap-2">
                        <a href="${directSsoUrl}" target="_blank" rel="noopener"
                            class="px-4 py-3.5 rounded-xl font-bold text-center text-sm no-underline"
                            style="background: var(--accent); color: #020617;">
                            ⚡ Direct Section Jump on AGC SSO →
                        </a>
                        <a href="${googleSsoUrl}" target="_blank" rel="noopener"
                            class="px-4 py-3 rounded-xl font-semibold text-center text-sm border"
                            style="border-color: var(--border); color: var(--text-main);">
                            🔍 Google Search (site:sso.agc.gov.sg only)
                        </a>
                    </div>
                </div>`;

            resultsArea.innerHTML = html;
        }

        lookupBtn.addEventListener('click', performLookup);
        sectionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performLookup(); });
        sectionInput.addEventListener('input', performLookup);
        statuteSelect.addEventListener('change', performLookup);

        performLookup();
    </script>
</body>
</html>
